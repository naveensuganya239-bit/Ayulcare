services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ayurveda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ayurveda
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  web:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://ayurveda:${POSTGRES_PASSWORD}@db:5432/ayurveda
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      SESSION_COOKIE_SECURE: "true"
    depends_on: [db, redis]
    ports: ["8000:8000"]
    volumes:
      - faiss_index:/srv/data/index      # FAISS index persists across restarts/deploys
      - reports:/srv/data/reports
volumes: { pgdata: {}, faiss_index: {}, reports: {} }
