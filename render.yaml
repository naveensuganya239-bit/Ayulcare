# Render.com blueprint (free/starter tier). Add GEMINI_API_KEY etc. in the dashboard.
services:
  - type: web
    name: ayulcare-ai
    runtime: docker
    plan: starter
    envVars:
      - { key: APP_ENV, value: production }
      - { key: SECRET_KEY, generateValue: true }
      - { key: FIELD_ENCRYPTION_KEY, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: DATABASE_URL, fromDatabase: { name: ayurveda-db, property: connectionString } }
    disk: { name: index, mountPath: /srv/data/index, sizeGB: 1 }
databases:
  - { name: ayulcare-db, plan: free }
