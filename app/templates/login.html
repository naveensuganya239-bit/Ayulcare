{% extends "market_base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="card auth-card">
  <h1 style="font-size:2rem">Welcome back</h1>
  <div id="err" class="alert alert-error hidden" role="alert"></div>
  <form id="login-form" novalidate>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary" style="width:100%" type="submit">Log in</button>
  </form>
  <p class="small muted" style="margin-top:18px">New here? <a href="{{ url_for('pages.register') }}">Create an account</a></p>
</div></div>
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
